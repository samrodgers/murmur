[package]
name = "murmur-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for the Murmur decentralized social protocol"

[dependencies]
murmur-core = { path = "../murmur-core" }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time display
chrono = "0.4"

# Misc
hex = "0.4"
anyhow = "1"
