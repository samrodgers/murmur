[package]
name = "murmur-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI for the Murmur decentralized social protocol"

[dependencies]
murmur-core = { path = "../../murmur-core" }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Misc
hex = "0.4"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "murmur-desktop"
path = "src/main.rs"
